<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="sapphireSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#89dceb"/>
    </linearGradient>
    <linearGradient id="glowRouter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#11111b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="440" rx="16" fill="url(#bgGrad)" stroke="#313244" stroke-width="1.5"/>

  <!-- Subtle grid pattern -->
  <g stroke="#313244" stroke-width="0.5" stroke-opacity="0.35">
    <line x1="40" y1="0" x2="40" y2="440"/>
    <line x1="160" y1="0" x2="160" y2="440"/>
    <line x1="280" y1="0" x2="280" y2="440"/>
    <line x1="400" y1="0" x2="400" y2="440"/>
    <line x1="520" y1="0" x2="520" y2="440"/>
    <line x1="640" y1="0" x2="640" y2="440"/>
    <line x1="760" y1="0" x2="760" y2="440"/>
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Header -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="180" height="20" rx="4" fill="#313244" stroke="#74c7ec" stroke-opacity="0.4" stroke-width="1"/>
    <text x="90" y="14" fill="#89dceb" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">AI &amp; COGNITIVE SCIENCE</text>
    
    <text x="0" y="44" fill="#cdd6f4" font-family="'Inter', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">Multi-AI-Tutor: Ecossistema Pedagógico Puro</text>
    <text x="0" y="62" fill="#a6adc8" font-family="'Inter', sans-serif" font-size="12">Framework de tutoria cognitiva baseada em evidências científicas em STEM</text>
  </g>

  <!-- Tutor Router (Centro Superior) -->
  <g transform="translate(240, 115)" filter="url(#shadow)">
    <rect width="320" height="58" rx="10" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1.8"/>
    <rect x="2" y="2" width="316" height="54" rx="8" fill="url(#glowRouter)"/>
    <circle cx="24" cy="29" r="6" fill="#cba6f7"/>
    <text x="40" y="26" fill="#cba6f7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">tutor-router</text>
    <text x="40" y="42" fill="#bac2de" font-family="'Inter', sans-serif" font-size="10">Triagem inteligente e acolhimento com encaminhamento em 1 turno</text>
  </g>

  <!-- Conectores do Router para os Tutors -->
  <g stroke="#45475a" stroke-width="1.5" stroke-dasharray="3,3" fill="none">
    <path d="M 320 173 L 150 205"/>
    <path d="M 400 173 L 400 205"/>
    <path d="M 480 173 L 650 205"/>
  </g>

  <!-- Linha 1: 3 Personas -->
  <!-- Feynman -->
  <g transform="translate(40, 205)" filter="url(#shadow)">
    <rect width="220" height="85" rx="8" fill="#181825" stroke="#89dceb" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="4" fill="#89dceb"/>
    <text x="30" y="25" fill="#89dceb" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">tutor-feynman</text>
    <text x="14" y="45" fill="#cdd6f4" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Autoexplicação Pura</text>
    <text x="14" y="62" fill="#a6adc8" font-family="'Inter', sans-serif" font-size="9">Caça a jargões vazios, saltos causais e criação de analogias concretas</text>
  </g>

  <!-- Pólya -->
  <g transform="translate(290, 205)" filter="url(#shadow)">
    <rect width="220" height="85" rx="8" fill="#181825" stroke="#89b4fa" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="4" fill="#89b4fa"/>
    <text x="30" y="25" fill="#89b4fa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">tutor-polya</text>
    <text x="14" y="45" fill="#cdd6f4" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Heurística em 4 Etapas</text>
    <text x="14" y="62" fill="#a6adc8" font-family="'Inter', sans-serif" font-size="9">Compreender, Planejar, Executar e Retrospecto com pistas graduadas</text>
  </g>

  <!-- Mazur -->
  <g transform="translate(540, 205)" filter="url(#shadow)">
    <rect width="220" height="85" rx="8" fill="#181825" stroke="#fab387" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="4" fill="#fab387"/>
    <text x="30" y="25" fill="#fab387" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">tutor-mazur</text>
    <text x="14" y="45" fill="#cdd6f4" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Peer Instruction &amp; ConcepTests</text>
    <text x="14" y="62" fill="#a6adc8" font-family="'Inter', sans-serif" font-size="9">Debate ativo de misconceptions com defesa convicta do colega IA</text>
  </g>

  <!-- Linha 2: 3 Personas -->
  <!-- Wieman -->
  <g transform="translate(40, 305)" filter="url(#shadow)">
    <rect width="220" height="85" rx="8" fill="#181825" stroke="#a6e3a1" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="4" fill="#a6e3a1"/>
    <text x="30" y="25" fill="#a6e3a1" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">tutor-wieman</text>
    <text x="14" y="45" fill="#cdd6f4" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Prática Deliberada em STEM</text>
    <text x="14" y="62" fill="#a6adc8" font-family="'Inter', sans-serif" font-size="9">Micro-tarefas atômicas, feedback ágil e critério de 80% de maestria</text>
  </g>

  <!-- Papert -->
  <g transform="translate(290, 305)" filter="url(#shadow)">
    <rect width="220" height="85" rx="8" fill="#181825" stroke="#94e2d5" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="4" fill="#94e2d5"/>
    <text x="30" y="25" fill="#94e2d5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">tutor-papert</text>
    <text x="14" y="45" fill="#cdd6f4" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Construcionismo &amp; Debugging</text>
    <text x="14" y="62" fill="#a6adc8" font-family="'Inter', sans-serif" font-size="9">Copiloto na criação de artefatos de código e investigação de modelos mentais</text>
  </g>

  <!-- Chabay-Sherwood -->
  <g transform="translate(540, 305)" filter="url(#shadow)">
    <rect width="220" height="85" rx="8" fill="#181825" stroke="#f9e2af" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="18" cy="22" r="4" fill="#f9e2af"/>
    <text x="30" y="25" fill="#f9e2af" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">tutor-chabay-sherwood</text>
    <text x="14" y="45" fill="#cdd6f4" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Primeiros Princípios</text>
    <text x="14" y="62" fill="#a6adc8" font-family="'Inter', sans-serif" font-size="9">Matter &amp; Interactions: Sistema vs Vizinhança, modelo atômico e predição Δt</text>
  </g>

  <!-- Bottom Pills / Architecture Badges -->
  <g transform="translate(40, 405)">
    <rect x="0" y="0" width="220" height="22" rx="11" fill="#313244" stroke="#45475a" stroke-width="1"/>
    <text x="110" y="14" fill="#89dceb" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">🛡️ Anti-Offloading Rigoroso</text>

    <rect x="240" y="0" width="230" height="22" rx="11" fill="#313244" stroke="#45475a" stroke-width="1"/>
    <text x="355" y="14" fill="#a6e3a1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">⚡ Válvulas de Escape em 3 Níveis</text>

    <rect x="490" y="0" width="270" height="22" rx="11" fill="#313244" stroke="#45475a" stroke-width="1"/>
    <text x="625" y="14" fill="#b4befe" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="middle">✨ Google Antigravity &amp; Gemini Gems</text>
  </g>
</svg>
